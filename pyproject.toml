[project]
name = "sportsforecast"
version = "0.1.0"
description = "Match outcome forecasting research: Elo, Dixon-Coles, market odds, walk-forward backtest"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11"]

[project.scripts]
sportsforecast = "sportsforecast.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
